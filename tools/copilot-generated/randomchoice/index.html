<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランダム選択ツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div id="list-id"></div>
    <div style="display: flex; align-items: center; gap: 0.5em;">
      <h1 id="main-title">ランダム選択ツール</h1>
      <button id="edit-title-btn" type="button">変更</button>
    </div>
    <button id="toggle-form-btn" type="button" style="margin-bottom:0.5em;">選択肢入力フォームを開く</button>
    <form id="choice-form" style="display:none;">
      <input type="text" id="choice-input" placeholder="選択肢を入力" required>
      <button type="submit">追加</button>
    </form>
    <h2>選択肢一覧</h2>
    <ul id="choice-list"></ul>
    <button id="random-btn">ランダムに選ぶ</button>
    <div id="result"></div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./service-worker.js');
      });
    }
  </script>
  <script src="main.js"></script>
  <script>
    // 折りたたみトグル
    document.addEventListener('DOMContentLoaded', function() {
      var form = document.getElementById('choice-form');
      var btn = document.getElementById('toggle-form-btn');
      btn.onclick = function() {
        if (form.style.display === 'none') {
          form.style.display = '';
          btn.textContent = '選択肢入力フォームを閉じる';
        } else {
          form.style.display = 'none';
          btn.textContent = '選択肢入力フォームを開く';
        }
      };
    });
  </script>
</body>
</html>
