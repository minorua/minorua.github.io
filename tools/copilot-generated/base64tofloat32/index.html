<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Base64 → Float32 配列 変換ツール</title>
  <style>
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; line-height: 1.6; margin: 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    .desc { color: #555; margin-bottom: 12px; }
    textarea { width: 100%; min-height: 160px; font-family: ui-monospace,Menlo,Consolas,monospace; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    button { padding: 8px 12px; }
    .result { margin-top: 16px; }
    .error { color: #b00020; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: right; }
    th { background: #f7f7f7; }
    .muted { color: #777; font-size: 0.9em; }
    .counts { margin-top: 6px; }
    .footer { margin-top: 24px; font-size: 0.9em; color: #666; }
  </style>
</head>
<body>
  <h1>Base64 → Float32 配列 変換ツール</h1>
  <p class="desc">テキストエリアに Base64 文字列を貼り付けて「変換」を押すと、バイト列を Float32 配列として表示します。端数のバイトは無視されます。</p>

  <label for="base64Input">Base64 文字列</label>
  <textarea id="base64Input" placeholder="ここに Base64 を貼り付け"></textarea>

  <div class="controls">
    <label>
      エンディアン:
      <select id="endianness">
        <option value="little" selected>Little-endian (一般的)</option>
        <option value="big">Big-endian</option>
      </select>
    </label>
    <label>
      表示桁数:
      <input id="precision" type="number" min="1" max="15" value="6" />
    </label>
    <button id="decodeBtn">変換</button>
    <button id="clearBtn">クリア</button>
    <button id="sampleBtn">サンプル挿入</button>
  </div>

  <div id="message" class="error" role="alert" aria-live="polite"></div>

  <div class="result" id="result" hidden>
    <div class="counts" id="counts"></div>
    <div class="muted">CSV としてコピーしたい場合は選択してコピーしてください。</div>
    <table id="table">
      <thead>
        <tr>
          <th style="text-align:left">Index</th>
          <th>Float32</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div class="footer muted">このページはローカルで動作し、入力は送信されません。Data URL (例: data:application/octet-stream;base64,...) にも対応します。</div>

  <script src="main.js"></script>
</body>
</html>
